description: 'Lattice is a people management platform used by over 5,000 companies
  to run performance reviews, track OKRs and goals, collect employee engagement survey
  data, manage compensation, and handle core HR (HRIS) workflows. The platform exposes
  two public REST APIs: the Lattice Talent API (v1) for performance, goals, feedback,
  and review data, and the Lattice HRIS API (v2) for employee records and organizational
  data. Both APIs use API-key authentication and are documented on the Lattice Developer
  Hub at developers.lattice.com. Lattice integrates with Slack, Gmail, Microsoft Teams,
  Salesforce, BambooHR, Okta, and other enterprise tools, and supports SCIM provisioning
  for identity management.

  '
