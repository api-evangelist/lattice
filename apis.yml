apis:
- name: Lattice Talent API
  description: 'REST API for Lattice''s Talent product suite covering users, goals,
    OKRs, performance review cycles, continuous feedback, competencies, tasks, and
    organizational departments. Uses cursor-based pagination and API key authentication.
    The base URL is https://api.latticehq.com/v1/.

    '
